version: '3.9'

services:
  postgres:
    image: seatflow-postgres:local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - target: 5432
        published: 15432
        protocol: tcp
        mode: ingress
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seatflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  inventory:
    image: seatflow-inventory:local
    environment:
      HOST: 0.0.0.0
      PORT: "8082"
      DATABASE_URL: postgresql://sf_inventory:inventorypw@postgres:5432/sf_inventory
      DB_POOL_SIZE: "12"
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8083
      NOTIFICATION_URL: http://notification:8084
      HTTP_TIMEOUT_MS: "300"
      RETRY_ATTEMPTS: "3"
      RETRY_BASE_MS: "80"
      WORKER_INTERVAL_MS: "100"
      ENABLE_SIMULATION: "true"
      MOCK_DELAY_MS: "1200"
    ports:
      - target: 8082
        published: 8082
        protocol: tcp
        mode: ingress
    networks:
      - seatflow
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  payment:
    image: seatflow-payment:local
    environment:
      HOST: 0.0.0.0
      PORT: "8083"
      DATABASE_URL: postgresql://sf_payment:paymentpw@postgres:5432/sf_payment
      DB_POOL_SIZE: "12"
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8083
      NOTIFICATION_URL: http://notification:8084
      HTTP_TIMEOUT_MS: "300"
      RETRY_ATTEMPTS: "3"
      RETRY_BASE_MS: "80"
      WORKER_INTERVAL_MS: "100"
      ENABLE_SIMULATION: "true"
      MOCK_DELAY_MS: "1200"
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
    networks:
      - seatflow
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8083/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  notification:
    image: seatflow-notification:local
    environment:
      HOST: 0.0.0.0
      PORT: "8084"
      DATABASE_URL: postgresql://sf_notification:notificationpw@postgres:5432/sf_notification
      DB_POOL_SIZE: "12"
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8083
      NOTIFICATION_URL: http://notification:8084
      HTTP_TIMEOUT_MS: "300"
      RETRY_ATTEMPTS: "3"
      RETRY_BASE_MS: "80"
      WORKER_INTERVAL_MS: "100"
      ENABLE_SIMULATION: "true"
      MOCK_DELAY_MS: "1200"
    ports:
      - target: 8084
        published: 8084
        protocol: tcp
        mode: ingress
    networks:
      - seatflow
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8084/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  booking:
    image: seatflow-booking:local
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      DATABASE_URL: postgresql://sf_booking:bookingpw@postgres:5432/sf_booking
      DB_POOL_SIZE: "12"
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8083
      NOTIFICATION_URL: http://notification:8084
      HTTP_TIMEOUT_MS: "300"
      RETRY_ATTEMPTS: "3"
      RETRY_BASE_MS: "80"
      WORKER_INTERVAL_MS: "100"
      ENABLE_SIMULATION: "true"
      MOCK_DELAY_MS: "1200"
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
        mode: ingress
    networks:
      - seatflow
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ui:
    image: seatflow-ui:local
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      VITE_BOOKING_URL: http://booking:8081
      VITE_INVENTORY_URL: http://inventory:8082
      VITE_PAYMENT_URL: http://payment:8083
      VITE_NOTIFICATION_URL: http://notification:8084
    ports:
      - target: 5173
        published: 5173
        protocol: tcp
        mode: ingress
    networks:
      - seatflow
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  seatflow:
    driver: overlay

volumes:
  postgres_data:
